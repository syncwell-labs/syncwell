# Fly.io template: one machine with a persistent volume.
#   fly launch --no-deploy --copy-config
#   fly volumes create syncwell_data --size 1
#   fly secrets set SYNCWELL_SECRET=... SYNCWELL_ADMIN_TOKEN=... SYNCWELL_ORIGINS=https://YOUR_HOST
#   fly deploy
# The image runs as uid 65532; chown the volume once after it is attached:
#   fly ssh console -u root -C "chown -R 65532:65532 /data"
app = "syncwell"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  SYNCWELL_DATA = "/data"
  SYNCWELL_FSYNC = "batch"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "3s"
    grace_period = "5s"
    method = "GET"
    path = "/healthz"

[[mounts]]
  source = "syncwell_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
