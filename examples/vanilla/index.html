<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Syncwell vanilla example</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f2eee6;
        --panel: #fbf8f1;
        --text: #1d1a15;
        --muted: #6a6154;
        --border: rgba(29, 26, 21, 0.16);
        --accent: #a03a22;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #17140f;
          --panel: #201c15;
          --text: #ece5d5;
          --muted: #a09684;
          --border: rgba(236, 229, 213, 0.15);
          --accent: #d9825e;
        }
      }
      body {
        font: 15px/1.55 ui-sans-serif, system-ui, "Segoe UI", Helvetica, Arial, sans-serif;
        max-width: 640px; margin: 48px auto; padding: 0 16px;
        background: var(--bg); color: var(--text);
      }
      h1 {
        font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Charter, Georgia, "Times New Roman", serif;
        font-weight: 600; letter-spacing: -0.012em;
        padding-bottom: 12px; border-bottom: 1px solid var(--border);
      }
      label {
        display: block; margin-top: 18px;
        font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Charter, Georgia, "Times New Roman", serif;
        font-size: 12.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em;
      }
      input, textarea {
        font: inherit; width: 100%; padding: 8px 10px; box-sizing: border-box;
        background: var(--panel); color: inherit; border: 1px solid var(--border); border-radius: 4px;
      }
      input { margin-top: 6px; }
      button {
        font: inherit; padding: 6px 14px; border: 1px solid var(--border); border-radius: 4px;
        background: transparent; color: inherit; cursor: pointer; margin-top: 16px;
      }
      button:hover { border-color: var(--accent); color: var(--accent); }
      #status { color: var(--muted); font: 500 13px/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    </style>
  </head>
  <body>
    <h1>Syncwell vanilla</h1>
    <p id="status">connecting…</p>
    <label>Title <input id="title" /></label>
    <label>Notes <textarea id="notes" rows="6"></textarea></label>
    <p><button id="undo">Undo</button> <button id="redo">Redo</button></p>

    <script type="module">
      import { Syncwell } from "/sdk/syncwell.js";

      const sw = new Syncwell(`${location.protocol === "https:" ? "wss:" : "ws:"}//${location.host}/ws`, "vanilla-example", {
        clientId: localStorage.getItem("syncwell-vanilla-id") || crypto.randomUUID(),
        persist: true,
      });
      const title = document.getElementById("title");
      const notes = document.getElementById("notes");
      const status = document.getElementById("status");

      const render = (live) => {
        if (document.activeElement !== title) title.value = live.title || "";
        if (document.activeElement !== notes) notes.value = live.notes || "";
      };
      sw.on("open", () => (status.textContent = "live"));
      sw.on("close", () => (status.textContent = "offline — edits are saved locally"));
      sw.on("change", render);
      sw.ready.then(() => {
        render(sw.live());
        sw.connect();
      });

      title.addEventListener("input", () => sw.set("title", title.value));
      notes.addEventListener("input", () => sw.set("notes", notes.value));
      document.getElementById("undo").addEventListener("click", () => sw.undo());
      document.getElementById("redo").addEventListener("click", () => sw.redo());
    </script>
  </body>
</html>
