[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "syncwell-client"
version = "0.5.0"
description = "Zero-dependency Python client for the Syncwell realtime collaboration engine"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [
    { name = "Syncwell Labs" }
]
keywords = ["crdt", "realtime", "collaboration", "websocket", "syncwell"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/syncwell-labs/syncwell"
Repository = "https://github.com/syncwell-labs/syncwell"

[tool.setuptools.packages.find]
where = ["."]
include = ["syncwell*"]

[tool.setuptools.package-data]
syncwell = ["py.typed"]
