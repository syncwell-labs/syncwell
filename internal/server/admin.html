<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Syncwell admin</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f2eee6;
        --panel: #fbf8f1;
        --panel-muted: #e9e2d4;
        --text: #1d1a15;
        --muted: #6a6154;
        --border: rgba(29, 26, 21, 0.16);
        --accent: #a03a22;
        --accent-soft: rgba(160, 58, 34, 0.10);
        --accent-contrast: #fbf8f1;
        --danger: #9b2c2c;
        --font-serif: "Iowan Old Style", "Palatino Linotype", Palatino, Charter, Georgia, "Times New Roman", serif;
        --font-sans: ui-sans-serif, system-ui, "Segoe UI", Helvetica, Arial, sans-serif;
        --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #17140f;
          --panel: #201c15;
          --panel-muted: #2a241b;
          --text: #ece5d5;
          --muted: #a09684;
          --border: rgba(236, 229, 213, 0.15);
          --accent: #d9825e;
          --accent-soft: rgba(217, 130, 94, 0.14);
          --accent-contrast: #17140f;
          --danger: #d97b7b;
        }
      }
      * { box-sizing: border-box; }
      ::selection { background: var(--accent-soft); }
      ::placeholder { color: var(--muted); opacity: 0.75; }
      :root { accent-color: var(--accent); }
      :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      body { margin: 0; font: 15px/1.55 var(--font-sans); background: var(--bg); color: var(--text); }
      main { max-width: 1080px; margin: 0 auto; padding: 40px 20px 32px; }
      .kicker {
        margin: 0 0 8px;
        font: 600 11px/1 var(--font-sans);
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--muted);
      }
      h1 {
        margin: 0;
        font-family: var(--font-serif);
        font-weight: 600;
        font-size: clamp(28px, 3vw, 34px);
        letter-spacing: -0.012em;
        line-height: 1.1;
        padding-bottom: 14px;
        border-bottom: 1px solid var(--border);
      }
      p { color: var(--muted); margin: 14px 0 20px; font-family: var(--font-serif); font-style: italic; font-size: 15.5px; max-width: 72ch; }
      .bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
      input {
        flex: 1 1 280px; padding: 9px 12px; border-radius: 4px;
        border: 1px solid var(--border); background: var(--panel); color: inherit; font: inherit;
      }
      button {
        padding: 8px 14px; border-radius: 4px; border: 1px solid var(--border);
        background: transparent; color: inherit; font: inherit; cursor: pointer;
        transition: border-color 0.15s, color 0.15s, background 0.15s;
      }
      button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
      button:disabled { opacity: 0.5; cursor: default; }
      button.primary {
        background: var(--text); border-color: var(--text); color: var(--bg); font-weight: 550;
      }
      button.primary:hover:not(:disabled) {
        background: var(--accent); border-color: var(--accent); color: var(--accent-contrast);
      }
      button.danger { color: var(--danger); }
      button.danger:hover:not(:disabled) { border-color: var(--danger); color: var(--danger); }
      table {
        width: 100%; border-collapse: collapse; background: var(--panel);
        border: 1px solid var(--border); border-radius: 6px; overflow: hidden;
      }
      th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); }
      th {
        font-family: var(--font-serif); font-size: 12px; font-weight: 700;
        text-transform: uppercase; letter-spacing: 0.08em; color: var(--text);
        background: var(--panel-muted);
      }
      tr:last-child td { border-bottom: 0; }
      td { font-variant-numeric: tabular-nums; }
      td.actions { display: flex; gap: 6px; flex-wrap: wrap; }
      #error { color: var(--danger); min-height: 1.4em; margin-bottom: 12px; font-size: 14px; }
      code { background: var(--panel-muted); padding: 1px 5px; border-radius: 3px; font-family: var(--font-mono); font-size: 0.9em; }
      a { color: var(--accent); }
    </style>
  </head>
  <body>
    <main>
      <p class="kicker">Syncwell — operations</p>
      <h1>Admin</h1>
      <p>
        Live rooms on this node. The token is kept in <code>sessionStorage</code> and sent only in the
        <code>Authorization</code> header. <a href="/">Back to the demo</a>
      </p>
      <div class="bar">
        <input id="token" type="password" placeholder="Admin token (SYNCWELL_ADMIN_TOKEN)" autocomplete="off" />
        <button class="primary" id="refresh">Refresh</button>
      </div>
      <div id="error" role="alert"></div>
      <table>
        <thead>
          <tr><th>Room</th><th>Clients</th><th>Live</th><th>Tombstones</th><th>Low water</th><th>Owner</th><th>Actions</th></tr>
        </thead>
        <tbody id="rooms"><tr><td colspan="7">Enter a token and refresh.</td></tr></tbody>
      </table>
    </main>
    <script>
      const tokenEl = document.getElementById("token");
      const roomsEl = document.getElementById("rooms");
      const errorEl = document.getElementById("error");
      tokenEl.value = sessionStorage.getItem("syncwell-admin-token") || "";
      tokenEl.addEventListener("change", () => sessionStorage.setItem("syncwell-admin-token", tokenEl.value));

      function headers() {
        return tokenEl.value ? { Authorization: `Bearer ${tokenEl.value}` } : {};
      }

      function clearError() { errorEl.textContent = ""; }
      function showError(message) { errorEl.textContent = message; }

      function row(room) {
        const tr = document.createElement("tr");
        for (const value of [room.id, room.clients, room.live, room.tombstones, room.lowWater, room.owner || "—"]) {
          const td = document.createElement("td");
          td.textContent = String(value);
          tr.appendChild(td);
        }
        const actions = document.createElement("td");
        actions.className = "actions";
        for (const [label, action, className] of [
          ["Resnapshot", "resnapshot", ""],
          ["Evict", "evict", "danger"],
        ]) {
          const button = document.createElement("button");
          button.textContent = label;
          button.className = className;
          button.addEventListener("click", () => act(room.id, action));
          actions.appendChild(button);
        }
        tr.appendChild(actions);
        return tr;
      }

      async function refresh() {
        clearError();
        const refreshBtn = document.getElementById("refresh");
        refreshBtn.disabled = true;
        try {
          const res = await fetch("/admin/api/rooms", { headers: headers() });
          if (!res.ok) {
            roomsEl.innerHTML = "";
            showError(res.status === 401 ? "Unauthorized: check the admin token." : `Request failed (${res.status}).`);
            return;
          }
          const data = await res.json();
          roomsEl.innerHTML = "";
          if (!data.rooms.length) {
            const tr = document.createElement("tr");
            const td = document.createElement("td");
            td.colSpan = 7;
            td.textContent = "No live rooms.";
            tr.appendChild(td);
            roomsEl.appendChild(tr);
            return;
          }
          data.rooms.sort((a, b) => a.id.localeCompare(b.id));
          for (const room of data.rooms) roomsEl.appendChild(row(room));
        } catch (err) {
          roomsEl.innerHTML = "";
          showError(`Network error: ${err?.message || err} — is the server reachable?`);
        } finally {
          refreshBtn.disabled = false;
        }
      }

      async function act(room, action) {
        clearError();
        if (action === "evict" && !confirm(`Evict room "${room}" and disconnect its clients?`)) return;
        try {
          const res = await fetch(`/admin/api/rooms/${encodeURIComponent(room)}/${action}`, {
            method: "POST",
            headers: headers(),
          });
          if (!res.ok) {
            showError(`${action} failed (${res.status}).`);
            return;
          }
        } catch (err) {
          showError(`Network error: ${err?.message || err} — is the server reachable?`);
          return;
        }
        await refresh();
      }

      document.getElementById("refresh").addEventListener("click", refresh);
      if (tokenEl.value) refresh();
    </script>
  </body>
</html>
