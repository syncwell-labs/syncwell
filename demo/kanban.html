<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Syncwell — collaborative kanban</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f4f6fb;
        --panel: #ffffff;
        --panel-muted: #e9edf6;
        --text: #152033;
        --muted: #4a5a72;
        --accent: #2f6bff;
        --accent-soft: rgba(47, 107, 255, 0.12);
        --accent-contrast: #ffffff;
        --border: rgba(21, 32, 51, 0.14);
        --focus-ring: 0 0 0 3px var(--accent);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0e1422;
          --panel: #171f31;
          --panel-muted: #20283d;
          --text: #e7edf8;
          --muted: #9aa7c2;
          --accent: #7aa2ff;
          --accent-soft: rgba(122, 162, 255, 0.16);
          --accent-contrast: #0b1220;
          --border: rgba(231, 237, 248, 0.12);
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font: 15px/1.5 system-ui, sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at top left, rgba(47, 107, 255, 0.14), transparent 32%),
          radial-gradient(circle at top right, rgba(92, 161, 255, 0.1), transparent 30%),
          var(--bg);
      }
      main { padding: 24px; }
      .demo-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 12px;
        margin-bottom: 20px;
      }
      .demo-header h1 { font-size: clamp(26px, 3vw, 34px); margin: 0; line-height: 1.1; }
      .room-info { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
      .room-info code { background: var(--panel-muted); padding: 2px 8px; border-radius: 6px; font-size: 12px; }
      .btn {
        padding: 8px 14px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--text);
        font: inherit;
        cursor: pointer;
        transition: border-color 0.15s, box-shadow 0.15s;
      }
      .btn:hover { border-color: var(--accent); }
      .btn:focus-visible { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
      .btn.primary { background: var(--accent); color: var(--accent-contrast); border-color: var(--accent); }
      .btn.primary:hover { filter: brightness(0.95); }
      #status {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        padding: 4px 10px;
        border-radius: 999px;
        background: var(--panel-muted);
        color: var(--muted);
      }
      #status::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: currentColor;
      }
      #status.live { background: var(--accent); color: var(--accent-contrast); }
      #peers { display: flex; gap: 6px; flex-wrap: wrap; }
      .peer {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: var(--muted);
        background: var(--panel-muted);
        border-radius: 999px;
        padding: 2px 8px;
      }
      .peer::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--peer-color);
        display: inline-block;
      }
      .board {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 16px;
        max-width: 1100px;
      }
      .col {
        background: color-mix(in srgb, var(--panel) 95%, transparent);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 12px;
        min-height: 240px;
        display: flex;
        flex-direction: column;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.06);
      }
      .col h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 4px 6px 12px; }
      .col.drag-over { outline: 2px dashed var(--accent); outline-offset: -4px; }
      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px 12px;
        margin-bottom: 8px;
        box-shadow: 0 1px 2px rgba(0,0,0,.08);
        cursor: grab;
      }
      .card:active { cursor: grabbing; }
      .card:focus-visible,
      .add input:focus-visible,
      .add button:focus-visible,
      .card .del:focus-visible,
      a:focus-visible,
      button:focus-visible,
      input:focus-visible,
      textarea:focus-visible {
        outline: none;
        box-shadow: var(--focus-ring);
      }
      .card-row { display: flex; align-items: flex-start; gap: 8px; }
      .card-text { flex: 1; min-width: 0; word-break: break-word; }
      .card .move {
        flex: none;
        font-size: 12px;
        max-width: 84px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--panel);
        color: inherit;
        cursor: pointer;
        padding: 2px 4px;
      }
      .card .del {
        flex: none;
        color: var(--muted);
        cursor: pointer;
        border: 0;
        background: none;
        font-size: 18px;
        line-height: 1;
        padding: 2px 4px;
      }
      .add { display: flex; gap: 6px; margin-top: auto; }
      .add input {
        flex: 1;
        padding: 9px 10px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--panel);
        color: inherit;
      }
      .add button {
        padding: 9px 12px;
        border: 0;
        border-radius: 8px;
        background: var(--accent);
        color: var(--accent-contrast);
        cursor: pointer;
      }
      .hint { color: var(--muted); font-size: 13px; margin-top: 16px; max-width: 1000px; }
      a { color: var(--accent); }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
    <script>
      (() => {
        const params = new URLSearchParams(location.search);
        if (!params.has("test")) return;
        class FakeSyncwell {
          constructor() {
            this.handlers = {};
            this.doc = new Map();
          }
          on(event, cb) {
            (this.handlers[event] ||= []).push(cb);
            return this;
          }
          _emit(event, payload) {
            for (const cb of this.handlers[event] || []) cb(payload);
          }
          connect() {
            queueMicrotask(() => {
              this._emit("open");
              this._emit("change", this.live());
            });
            return this;
          }
          close() {
            this._emit("close");
          }
          _touch(key, value) {
            if (value == null) this.doc.delete(key);
            else this.doc.set(key, value);
            this._emit("change", this.live());
          }
          set(key, value) { this._touch(key, value); }
          delete(key) { this._touch(key, null); }
          get(key) { return this.doc.get(key); }
          live() {
            const out = {};
            for (const [k, v] of this.doc.entries()) out[k] = v;
            return out;
          }
          presence() {}
        }
        window.__SYNCWELL_FACTORY__ = FakeSyncwell;
      })();
    </script>
  </head>
  <body>
    <main>
      <header class="demo-header">
        <h1>Syncwell Kanban</h1>
        <div class="room-info" aria-live="polite">
          <span>Room:</span>
          <code id="room-id">loading…</code>
          <button class="btn" id="copy-invite" type="button" aria-label="Copy invite link">Copy invite link</button>
        </div>
      </header>
      <span id="status" role="status" aria-live="polite">connecting…</span>
      <div id="peers" role="group" aria-label="connected peers" title="connected peers"></div>
      <div class="board" id="board"></div>
      <p class="hint">
        Drag cards between columns or use keyboard shortcuts once a card is focused:
        left and right arrows move it, Delete removes it. Open the invite link in another
        window to collaborate. <a href="/">← simple demo</a> | <a href="/sequence.html">Text demo →</a>
      </p>
    </main>

    <script type="module">
      const isTest = new URLSearchParams(location.search).has("test");
      let Syncwell = window.__SYNCWELL_FACTORY__;
      if (!Syncwell) {
        ({ Syncwell } = await import("/sdk/syncwell.js"));
      }

      const COLUMNS = [
        { id: "todo", label: "To Do" },
        { id: "doing", label: "Doing" },
        { id: "done", label: "Done" },
      ];
      const PREFIX = "card:";
      const clientIdKey = "syncwell-kanban-client-id";
      const fallbackId = () => `kanban-${Math.floor(Math.random() * 1e9).toString(36)}`;
      const protocolId = localStorage.getItem(clientIdKey) || (crypto.randomUUID?.() ?? fallbackId());
      localStorage.setItem(clientIdKey, protocolId);

      // Room ID from URL or generate new one
      const params = new URLSearchParams(location.search);
      let roomId = params.get("room");
      if (!roomId) {
        roomId = `kanban-${Math.random().toString(36).slice(2, 10)}`;
        params.set("room", roomId);
        history.replaceState(null, "", `${location.pathname}?${params.toString()}`);
      }

      // Update URL with room ID for sharing
      const roomIdEl = document.getElementById("room-id");
      if (roomIdEl) roomIdEl.textContent = roomId;

      // Update invite link when room changes
      function updateInviteLink() {
        const inviteUrl = new URL(location.href);
        inviteUrl.searchParams.set("room", roomId);
        return inviteUrl.toString();
      }

      const copyInviteBtn = document.getElementById("copy-invite");
      if (copyInviteBtn) {
        copyInviteBtn.addEventListener("click", async () => {
          const inviteLink = updateInviteLink();
          try {
            await navigator.clipboard.writeText(inviteLink);
            const original = copyInviteBtn.textContent;
            copyInviteBtn.textContent = "Copied!";
            setTimeout(() => { copyInviteBtn.textContent = original; }, 1500);
          } catch (e) {
            copyInviteBtn.textContent = "Failed";
            setTimeout(() => { copyInviteBtn.textContent = "Copy invite link"; }, 1500);
          }
        });
      }

      const statusEl = document.getElementById("status");
      const peersEl = document.getElementById("peers");
      const boardEl = document.getElementById("board");

      const myHue = Math.floor(Math.random() * 360);
      const peers = new Map();

      const token = new URLSearchParams(location.search).get("token") || undefined;
      const sw = new Syncwell(`${location.protocol === "https:" ? "wss:" : "ws:"}//${location.host}/ws`, roomId, {
        clientId: protocolId,
        persist: true,
        token,
      });

      // --- ordering helper: monotonic-ish key so new cards land at the bottom ---
      let lastOrd = 0;
      function nextOrd() {
        const t = Date.now();
        lastOrd = t > lastOrd ? t : lastOrd + 1;
        return lastOrd;
      }

      // --- rendering ---------------------------------------------------------
      function cards() {
        const live = sw.live();
        return Object.keys(live)
          .filter((k) => k.startsWith(PREFIX))
          .map((k) => ({ id: k.slice(PREFIX.length), ...live[k] }))
          .sort((a, b) => (a.ord || 0) - (b.ord || 0));
      }

      function render() {
        // Preserve focus and in-progress typing across the full re-render.
        const active = document.activeElement;
        let restore = null;
        if (active && boardEl.contains(active)) {
          if (active.tagName === "INPUT" && active.closest(".col")) {
            restore = {
              col: active.closest(".col").dataset.col,
              value: active.value,
              selStart: active.selectionStart,
              selEnd: active.selectionEnd,
            };
          } else if (active.classList?.contains("card") && active.dataset.id) {
            restore = { id: active.dataset.id };
          }
        }

        const all = cards();
        boardEl.innerHTML = "";
        for (const col of COLUMNS) {
          const colEl = document.createElement("div");
          colEl.className = "col";
          colEl.dataset.col = col.id;
          const header = document.createElement("h2");
          header.textContent = col.label;
          colEl.appendChild(header);

          for (const c of all.filter((x) => x.col === col.id)) {
            const card = document.createElement("div");
            card.className = "card";
            card.draggable = true;
            card.dataset.id = c.id;
            card.tabIndex = 0;
            card.setAttribute("role", "button");
            card.setAttribute("aria-label", `${c.text}. In ${col.label}. Press arrow keys to move, delete to remove.`);
            const row = document.createElement("div");
            row.className = "card-row";
            const text = document.createElement("span");
            text.className = "card-text";
            text.textContent = c.text;
            const del = document.createElement("button");
            del.className = "del";
            del.type = "button";
            del.title = "Delete card";
            del.setAttribute("aria-label", `Delete card ${c.text}`);
            del.textContent = "×";
            del.onclick = () => sw.delete(PREFIX + c.id);
            // Touch-friendly move control (HTML5 drag-and-drop does not fire on touch).
            const move = document.createElement("select");
            move.className = "move";
            move.setAttribute("aria-label", `Move card ${c.text} to column`);
            for (const dest of COLUMNS) {
              const opt = document.createElement("option");
              opt.value = dest.id;
              opt.textContent = dest.id === c.col ? "→ here" : `→ ${dest.label}`;
              opt.selected = dest.id === c.col;
              move.appendChild(opt);
            }
            move.onchange = () => {
              if (move.value === c.col) return;
              sw.set(PREFIX + c.id, { ...c, col: move.value, ord: nextOrd() });
            };
            row.append(text, move, del);
            card.appendChild(row);
            card.addEventListener("dragstart", (e) => e.dataTransfer.setData("text/plain", c.id));
            card.addEventListener("keydown", (e) => {
              if (e.key === "Delete" || e.key === "Backspace") {
                e.preventDefault();
                sw.delete(PREFIX + c.id);
                return;
              }
              const index = COLUMNS.findIndex((x) => x.id === c.col);
              if (e.key === "ArrowLeft" && index > 0) {
                e.preventDefault();
                sw.set(PREFIX + c.id, { ...c, col: COLUMNS[index - 1].id, ord: nextOrd() });
              }
              if (e.key === "ArrowRight" && index < COLUMNS.length - 1) {
                e.preventDefault();
                sw.set(PREFIX + c.id, { ...c, col: COLUMNS[index + 1].id, ord: nextOrd() });
              }
            });
            colEl.appendChild(card);
          }

          const add = document.createElement("div");
          add.className = "add";
          const input = document.createElement("input");
          input.type = "text";
          input.placeholder = "Add a card…";
          input.setAttribute("aria-label", `New card in ${col.label}`);
          const button = document.createElement("button");
          button.type = "button";
          button.textContent = "Add";
          const commit = () => {
            const text = input.value.trim();
            if (!text) return;
            sw.set(PREFIX + crypto.randomUUID().slice(0, 8), { text, col: col.id, ord: nextOrd() });
            input.value = "";
          };
          button.onclick = commit;
          add.append(input, button);
          input.addEventListener("keydown", (e) => e.key === "Enter" && commit());
          colEl.appendChild(add);

          colEl.addEventListener("dragover", (e) => { e.preventDefault(); colEl.classList.add("drag-over"); });
          colEl.addEventListener("dragleave", () => colEl.classList.remove("drag-over"));
          colEl.addEventListener("drop", (e) => {
            e.preventDefault();
            colEl.classList.remove("drag-over");
            const id = e.dataTransfer.getData("text/plain");
            const cur = sw.get(PREFIX + id);
            if (cur && cur.col !== col.id) {
              sw.set(PREFIX + id, { ...cur, col: col.id, ord: nextOrd() });
            }
          });

          boardEl.appendChild(colEl);
        }

        if (restore?.col) {
          const col = boardEl.querySelector(`.col[data-col="${CSS.escape(restore.col)}"]`);
          const input = col?.querySelector("input");
          if (input) {
            input.focus();
            input.value = restore.value;
            try {
              input.setSelectionRange(restore.selStart, restore.selEnd);
            } catch {
              /* selection unsupported on input types without a selection */
            }
          }
        } else if (restore?.id) {
          const card = boardEl.querySelector(`.card[data-id="${CSS.escape(restore.id)}"]`);
          card?.focus();
        }
      }

      function renderPeers() {
        peersEl.innerHTML = "";
        if (peers.size === 0) {
          peersEl.textContent = "You're the only one here — share the invite link to collaborate";
          return;
        }
        for (const [clientId, hue] of peers) {
          const a = document.createElement("span");
          a.className = "peer";
          a.style.setProperty("--peer-color", `hsl(${hue} 70% 55%)`);
          a.textContent = clientId === protocolId ? "You" : clientId;
          peersEl.appendChild(a);
        }
      }

      // --- wiring ------------------------------------------------------------
      sw.on("open", () => {
        statusEl.textContent = "live";
        statusEl.className = "live";
        sw.presence({ hue: myHue });
      });
      sw.on("close", () => {
        statusEl.textContent = "offline — editing locally…";
        statusEl.className = "";
      });
      sw.on("change", render);
      sw.on("presence", ({ clientId, data }) => {
        if (data?.hue != null) {
          peers.set(clientId, data.hue);
          renderPeers();
        }
      });
      sw.on("leave", ({ clientId }) => { peers.delete(clientId); renderPeers(); });
      sw.on("error", (err) => {
        statusEl.textContent = `error: ${err.code}`;
        statusEl.className = "";
      });

      async function waitFor(check, timeout = 3000) {
        const start = performance.now();
        while (performance.now() - start < timeout) {
          if (check()) return;
          await new Promise(requestAnimationFrame);
        }
        throw new Error("timed out waiting for test condition");
      }

      async function runE2E() {
        const addInput = () => boardEl.querySelector(".col[data-col='todo'] .add input");
        const addButton = () => boardEl.querySelector(".col[data-col='todo'] .add button");
        const firstCard = () => boardEl.querySelector(".col[data-col='todo'] .card");
        const movedCard = () => boardEl.querySelector(".col[data-col='doing'] .card");

        await waitFor(() => addInput() && addButton());

        const input = addInput();
        input.value = "Browser E2E";
        input.dispatchEvent(new Event("input", { bubbles: true }));
        addButton().click();

        await waitFor(() => firstCard());
        const card = firstCard();
        card.focus();
        card.dispatchEvent(new KeyboardEvent("keydown", { key: "ArrowRight", bubbles: true }));

        await waitFor(() => movedCard());
        movedCard().focus();
        movedCard().dispatchEvent(new KeyboardEvent("keydown", { key: "Delete", bubbles: true }));

        await waitFor(() => !boardEl.querySelector(".card"));
        const overflowOk = document.documentElement.scrollWidth <= window.innerWidth + 1;
        if (!overflowOk) throw new Error("layout overflow");
        document.body.dataset.e2e = "pass";
        statusEl.textContent = "browser e2e passed";
        statusEl.className = "live";
      }

      render();
      sw.connect();
      if (isTest) {
        runE2E().catch((err) => {
          document.body.dataset.e2e = "fail";
          statusEl.textContent = `browser e2e failed: ${err.message}`;
          statusEl.className = "";
          console.error(err);
        });
      }
    </script>
  </body>
</html>
