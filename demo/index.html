<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Syncwell — live multiplayer demo</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f5f7fb;
        --panel: #ffffff;
        --panel-muted: #eef1f7;
        --text: #132033;
        --muted: #4a5a72;
        --accent: #2f6bff;
        --accent-soft: rgba(47, 107, 255, 0.12);
        --accent-contrast: #ffffff;
        --border: rgba(19, 32, 51, 0.14);
        --focus-ring: 0 0 0 3px var(--accent);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0e1422;
          --panel: #171f31;
          --panel-muted: #202a40;
          --text: #e7edf8;
          --muted: #9aa7c2;
          --accent: #7aa2ff;
          --accent-soft: rgba(122, 162, 255, 0.16);
          /* Dark text on the lighter dark-mode accent keeps WCAG contrast ≥ 4.5:1. */
          --accent-contrast: #0b1220;
          --border: rgba(231, 237, 248, 0.12);
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font: 15px/1.5 system-ui, sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at top left, rgba(47, 107, 255, 0.14), transparent 32%),
          radial-gradient(circle at top right, rgba(92, 161, 255, 0.1), transparent 30%),
          var(--bg);
      }
      main {
        max-width: 760px;
        margin: 0 auto;
        padding: 40px 16px 32px;
      }
      .shell {
        background: color-mix(in srgb, var(--panel) 94%, transparent);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 20px;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.08);
      }
      .demo-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 12px;
        margin-bottom: 16px;
      }
      .demo-header h1 { margin: 0; font-size: clamp(28px, 4vw, 40px); line-height: 1.1; }
      .room-info { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
      .room-info code { background: var(--panel-muted); padding: 2px 8px; border-radius: 6px; font-size: 12px; }
      .btn {
        padding: 8px 14px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--text);
        font: inherit;
        cursor: pointer;
        transition: border-color 0.15s, box-shadow 0.15s;
      }
      .btn:hover { border-color: var(--accent); }
      .btn:focus-visible { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
      .btn.primary { background: var(--accent); color: var(--accent-contrast); border-color: var(--accent); }
      .btn.primary:hover { filter: brightness(0.95); }
      h1 { margin: 0 0 6px; font-size: clamp(28px, 4vw, 40px); line-height: 1.1; }
      .sub { color: var(--muted); margin: 0 0 18px; }
      #status {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        padding: 4px 10px;
        border-radius: 999px;
        background: var(--panel-muted);
        color: var(--muted);
      }
      #status::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: currentColor;
      }
      #status.live {
        background: var(--accent);
        color: var(--accent-contrast);
      }
      textarea, input[type=text] {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--panel);
        color: inherit;
        font: inherit;
        outline: none;
      }
      textarea {
        min-height: 180px;
        padding: 12px;
        resize: vertical;
        font: 15px/1.6 ui-monospace, monospace;
      }
      input[type=text] { padding: 10px 12px; font-size: 15px; }
      textarea:focus-visible, input[type=text]:focus-visible, button:focus-visible, a:focus-visible {
        border-color: var(--accent);
        box-shadow: var(--focus-ring);
      }
      label { font-weight: 650; display: block; margin: 18px 0 8px; }
      #peers { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; min-height: 28px; }
      .peer {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        color: var(--muted);
        background: var(--panel-muted);
        border-radius: 999px;
        padding: 3px 9px;
      }
      .peer::before {
        content: "";
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--peer-color);
        display: inline-block;
      }
      .hint { color: var(--muted); font-size: 13px; margin-top: 14px; }
      a { color: var(--accent); }
      .demo-nav { display: flex; gap: 12px; margin-top: 16px; flex-wrap: wrap; }
      .demo-nav a { padding: 8px 14px; border-radius: 8px; background: var(--panel-muted); color: var(--accent); text-decoration: none; font-size: 14px; border: 1px solid var(--border); }
      .demo-nav a:hover { background: var(--accent-soft); }
    </style>
  </head>
  <body>
    <main>
      <section class="shell" aria-labelledby="app-title">
        <div class="demo-header">
          <h1 id="app-title">Syncwell</h1>
          <div class="room-info" aria-live="polite">
            <span>Room:</span>
            <code id="room-id">loading…</code>
            <button class="btn" id="copy-invite" type="button" aria-label="Copy invite link">Copy invite link</button>
          </div>
        </div>
        <p class="sub">Open the invite link in another window to collaborate live. <span id="status" role="status" aria-live="polite">connecting…</span></p>

        <label for="title">Shared title</label>
        <input id="title" type="text" placeholder="Type a title…" autocomplete="off" />

        <label for="doc">Shared notes</label>
        <textarea id="doc" placeholder="Type here — every keystroke syncs to all peers…" aria-label="Shared notes"></textarea>

        <label id="peers-label">Live peers</label>
        <div id="peers" aria-labelledby="peers-label"></div>
        <p class="hint">Each dot is another connected client. Try killing the server and restarting it — the page reconnects and re-syncs automatically.</p>
        <nav class="demo-nav" aria-label="Demo navigation">
          <a href="/kanban.html">Kanban demo →</a>
          <a href="/sequence.html">Collaborative text →</a>
        </nav>
      </section>
    </main>

    <script type="module">
      import { Syncwell } from "/sdk/syncwell.js";

      const statusEl = document.getElementById("status");
      const titleEl = document.getElementById("title");
      const docEl = document.getElementById("doc");
      const peersEl = document.getElementById("peers");
      const roomIdEl = document.getElementById("room-id");
      const copyInviteBtn = document.getElementById("copy-invite");

      const myHue = Math.floor(Math.random() * 360);
      const peers = new Map();

      const clientIdKey = "syncwell-demo-client-id";
      const fallbackId = () => `demo-${Math.floor(Math.random() * 1e9).toString(36)}`;
      const savedClientId = localStorage.getItem(clientIdKey) || (crypto.randomUUID?.() ?? fallbackId());
      localStorage.setItem(clientIdKey, savedClientId);

      // Room ID from URL or generate new one
      const params = new URLSearchParams(location.search);
      let roomId = params.get("room");
      if (!roomId) {
        roomId = `demo-${Math.random().toString(36).slice(2, 10)}`;
        params.set("room", roomId);
        history.replaceState(null, "", `${location.pathname}?${params.toString()}`);
      }
      roomIdEl.textContent = roomId;

      // Update invite link when room changes
      function updateInviteLink() {
        const inviteUrl = new URL(location.href);
        inviteUrl.searchParams.set("room", roomId);
        return inviteUrl.toString();
      }

      copyInviteBtn.addEventListener("click", async () => {
        const inviteLink = updateInviteLink();
        try {
          await navigator.clipboard.writeText(inviteLink);
          const original = copyInviteBtn.textContent;
          copyInviteBtn.textContent = "Copied!";
          setTimeout(() => { copyInviteBtn.textContent = original; }, 1500);
        } catch (e) {
          copyInviteBtn.textContent = "Failed";
          setTimeout(() => { copyInviteBtn.textContent = "Copy invite link"; }, 1500);
        }
      });

      const token = new URLSearchParams(location.search).get("token") || undefined;
      const sw = new Syncwell(`${location.protocol === "https:" ? "wss:" : "ws:"}//${location.host}/ws`, roomId, {
        clientId: savedClientId,
        persist: true,
        token,
      });

      function renderPeers() {
        peersEl.innerHTML = "";
        if (peers.size === 0) {
          peersEl.textContent = "You're the only one here — share the invite link to collaborate";
          return;
        }
        for (const [clientId, hue] of peers) {
          const d = document.createElement("span");
          d.className = "peer";
          d.style.setProperty("--peer-color", `hsl(${hue} 70% 55%)`);
          const dot = document.createElement("span");
          dot.style.background = `hsl(${hue} 70% 55%)`;
          d.appendChild(dot);
          d.append(clientId === savedClientId ? "You" : clientId);
          peersEl.appendChild(d);
        }
      }

      function render(live) {
        if (document.activeElement !== titleEl) titleEl.value = live.title ?? "";
        if (document.activeElement !== docEl) docEl.value = live.doc ?? "";
      }

      sw.on("open", () => {
        statusEl.textContent = "live";
        statusEl.className = "live";
        sw.presence({ hue: myHue });
      });
      sw.on("close", () => {
        statusEl.textContent = "offline — editing locally, will resync…";
        statusEl.className = "";
      });
      sw.on("change", render);
      sw.on("presence", ({ clientId, data }) => {
        if (data?.hue != null) {
          peers.set(clientId, data.hue);
          renderPeers();
        }
      });
      sw.on("leave", ({ clientId }) => {
        peers.delete(clientId);
        renderPeers();
      });
      sw.on("error", (err) => {
        statusEl.textContent = `error: ${err.code}`;
        statusEl.className = "";
      });

      titleEl.addEventListener("input", () => sw.set("title", titleEl.value));
      docEl.addEventListener("input", () => sw.set("doc", docEl.value));

      // Hydrate from persisted local state so a reopened offline tab is not empty.
      sw.ready.then(() => render(sw.live())).catch(() => {});

      // Scrub the one-time token from the address bar and history.
      if (token) {
        params.delete("token");
        const qs = params.toString();
        history.replaceState(null, "", qs ? `${location.pathname}?${qs}` : location.pathname);
      }

      sw.connect();
    </script>
  </body>
</html>
