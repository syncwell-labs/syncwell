name: Bug report
description: Something is broken or behaves unexpectedly.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please do **not** include secrets, tokens, or
        private room contents. For security issues, use SECURITY.md instead.
  - type: input
    id: version
    attributes:
      label: Syncwell version
      description: Output of `syncwell -version` (or the commit SHA / Docker tag).
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you expected, and what actually happened.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal commands, config flags, and client code.
      placeholder: |
        1. syncwell -addr :8080 -data /tmp/sw
        2. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Server output around the failure (redact tokens and room data).
      render: shell
    validations:
      required: false
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS/arch, Go or Node client version, deployment (local, Docker, k8s).
    validations:
      required: true
