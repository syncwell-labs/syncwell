name: Benchmark

# Fixed-parameter run for a reproducible number to quote in docs. Results on
# shared GitHub runners are indicative, not a service-level benchmark.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.26.10"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Run benchmark
        run: |
          make build VERSION="${GITHUB_REF_NAME:-ci}" COMMIT=${GITHUB_SHA::12}
          CLIENTS=50 DURATION_MS=3000 INTERVAL_MS=5 make bench

      - name: Show result
        run: cat docs/product/BENCHMARKS.md

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: benchmarks-${{ github.sha }}
          path: docs/product/BENCHMARKS.md
