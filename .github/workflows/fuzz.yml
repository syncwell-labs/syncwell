name: Scheduled fuzzing

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: ./internal/crdt
            target: FuzzCanonicalJSON
          - package: ./internal/server
            target: FuzzValidateInbound
          - package: ./internal/server
            target: FuzzUnmarshalClusterEvent
          - package: ./internal/server
            target: FuzzVerifyAccessToken
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.26.10"
      - name: Fuzz ${{ matrix.target }}
        run: go test ${{ matrix.package }} -run=^$ -fuzz=${{ matrix.target }} -fuzztime=60s
