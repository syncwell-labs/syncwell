name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.26.10"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Configure Redis 7 durability for integration tests
        env:
          REDIS_CONTAINER: ${{ job.services.redis.id }}
        run: |
          docker exec "$REDIS_CONTAINER" redis-cli CONFIG SET appendonly yes
          docker exec "$REDIS_CONTAINER" redis-cli CONFIG SET appendfsync everysec

      - name: SDK install, typecheck, build
        working-directory: clients/javascript
        run: |
          npm ci
          npm test
          npm run typecheck
          npm run build
          node -e "require('./dist/cjs/syncwell.cjs')"

      - name: Vet, unit + race tests, coverage gate, JS tests, e2e, persistence, restore, GC, build
        env:
          SYNCWELL_TEST_REDIS_ADDR: 127.0.0.1:6379
        run: make all VERSION=ci COMMIT=${GITHUB_SHA::12} BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)

      - name: Redis three-process owner kill and re-home E2E
        env:
          NODE_TLS_REJECT_UNAUTHORIZED: "0"
          SYNCWELL_REDIS_URL: redis://127.0.0.1:6379
        run: make redis-e2e

      - name: Python polyglot client E2E
        run: make test-python

      - name: Container build/start smoke
        run: make container-smoke VERSION=ci COMMIT=${GITHUB_SHA::12} BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)

      - name: Adversarial convergence (chaos)
        run: make chaos

      - name: Benchmark smoke run
        run: CLIENTS=20 DURATION_MS=1500 make bench

      - name: Browser E2E
        run: |
          FIREFOX_BIN="$(command -v firefox)"
          GECKODRIVER_BIN="$(command -v geckodriver)"
          CHROMEDRIVER_BIN="$(command -v chromedriver)"
          CHROMIUM_BIN="$(command -v chromium || command -v chromium-browser || true)"
          GOOGLE_CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || true)"
          test -n "$CHROMIUM_BIN$GOOGLE_CHROME_BIN"
          {
            echo "FIREFOX_BIN=$FIREFOX_BIN"
            echo "GECKODRIVER_BIN=$GECKODRIVER_BIN"
            echo "CHROMEDRIVER_BIN=$CHROMEDRIVER_BIN"
            echo "CHROMIUM_BIN=$CHROMIUM_BIN"
            echo "GOOGLE_CHROME_BIN=$GOOGLE_CHROME_BIN"
          } >> "$GITHUB_ENV"
          make browser-e2e

      - name: Build docs site
        env:
          DOCS_BASE: /syncwell/
          DOCS_ORIGIN: https://syncwell-labs.github.io
        run: make docs-build

      - name: Accessibility scan (axe-core)
        env:
          DOCS_BASE: /syncwell/
        run: |
          command -v chromedriver
          command -v google-chrome || command -v chromium || command -v chromium-browser
          python3 tests/a11y/axe_a11y.py

      - name: Vulnerability scan
        uses: golang/govulncheck-action@b625fbe08f3bccbe446d94fbf87fcc875a4f50ee # v1.0.4
        with:
          go-version-input: "1.26.10"
          go-package: ./...

      - name: Upload benchmark results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: benchmarks
          path: docs/product/BENCHMARKS.md
