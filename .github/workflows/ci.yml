name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Vet, unit + race tests, JS tests, e2e, persistence, GC, build
        run: make all VERSION=ci COMMIT=${GITHUB_SHA::12} BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)

      - name: Container build/start smoke
        run: make container-smoke VERSION=ci COMMIT=${GITHUB_SHA::12} BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)

      - name: Adversarial convergence (chaos)
        run: make chaos

      - name: Benchmark smoke run
        run: CLIENTS=20 DURATION_MS=1500 make bench

      - name: Browser E2E
        run: |
          if command -v firefox >/dev/null && command -v geckodriver >/dev/null; then
            node --test test/browser_kanban_e2e.mjs
          else
            echo "Skipping browser E2E: firefox/geckodriver unavailable"
          fi

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks
          path: docs/BENCHMARKS.md
