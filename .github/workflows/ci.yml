name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: true

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: SDK install, typecheck, build
        working-directory: clients/javascript
        run: |
          npm ci
          npm test
          npm run typecheck
          npm run build
          node -e "require('./dist/cjs/syncwell.cjs')"

      - name: Vet, unit + race tests, coverage gate, JS tests, e2e, persistence, restore, GC, build
        run: make all VERSION=ci COMMIT=${GITHUB_SHA::12} BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)

      - name: Python polyglot client E2E
        run: make test-python

      - name: Container build/start smoke
        run: make container-smoke VERSION=ci COMMIT=${GITHUB_SHA::12} BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)

      - name: Adversarial convergence (chaos)
        run: make chaos

      - name: Benchmark smoke run
        run: CLIENTS=20 DURATION_MS=1500 make bench

      - name: Browser E2E
        run: |
          # ubuntu-latest ships both; fail loudly if that ever changes rather
          # than silently dropping the only real-browser coverage.
          command -v firefox
          command -v geckodriver
          node --test tests/e2e/browser_kanban_e2e.mjs

      - name: Build docs site
        env:
          DOCS_BASE: /syncwell/
          DOCS_ORIGIN: https://nil-vaghani.github.io
        run: make docs-build

      - name: Accessibility scan (axe-core)
        env:
          DOCS_BASE: /syncwell/
        run: |
          command -v chromedriver
          command -v google-chrome || command -v chromium || command -v chromium-browser
          python3 tests/a11y/axe_a11y.py

      - name: Vulnerability scan
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: "1.26"
          go-package: ./...

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks
          path: docs/product/BENCHMARKS.md
