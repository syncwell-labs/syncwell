name: Release Python Client

on:
  push:
    tags: ["python-v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run tests/build only (do not publish)"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  pypi:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/python
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build setuptools wheel twine

      - name: Run unit tests
        run: |
          python -m unittest test_crdt.py -v

      - name: Build sdist and wheel
        run: python -m build

      - name: Check package distribution
        run: python -m twine check dist/*

      - name: Publish to PyPI
        if: startsWith(github.ref, 'refs/tags/python-v') || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: python -m twine upload dist/*
