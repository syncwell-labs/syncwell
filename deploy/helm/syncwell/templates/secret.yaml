apiVersion: v1
kind: Secret
metadata:
  name: {{ include "syncwell.fullname" . }}-secret
  labels:
    {{- include "syncwell.labels" . | nindent 4 }}
type: Opaque
stringData:
  secret: {{ .Values.config.secret | default "" | quote }}
  admin-token: {{ .Values.config.adminToken | default "" | quote }}
  {{- if .Values.redis.enabled }}
  redis-password: {{ .Values.redis.password | default "" | quote }}
  {{- end }}
