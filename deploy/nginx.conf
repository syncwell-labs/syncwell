# nginx reverse proxy for Syncwell. Terminates TLS and forwards WebSockets.
# Copy to /etc/nginx/conf.d/syncwell.conf and set server_name + certificate
# paths. Keep proxy_read_timeout long so idle sockets are not cut server-side.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream syncwell {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name sync.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name sync.example.com;

    ssl_certificate     /etc/letsencrypt/live/sync.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sync.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 8m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://syncwell;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering     off;
    }

    # Cluster relay is node-to-node: allow only peer addresses.
    location = /cluster/event {
        allow 10.0.0.0/8;
        deny all;
        proxy_pass http://syncwell;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Operational endpoints are token-protected by the server; restrict them
    # further at the edge if they should not be public.
    location ~ ^/(stats|metrics)$ {
        allow 10.0.0.0/8;
        deny all;
        proxy_pass http://syncwell;
        proxy_set_header Host $host;
    }
}
